<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para vos ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #fff;
            padding: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        /* Centro de la flor (la foto) */
        .centro {
            width: 110px;
            height: 110px;
            background: #fff;
            border-radius: 50%;
            overflow: hidden;
            position: absolute;
            z-index: 10;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 4px solid #fff;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .centro:hover {
            transform: scale(1.05);
        }
        .centro img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Pétalos */
        .petalo {
            position: absolute;
            width: 90px;
            height: 130px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transform-origin: bottom center;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10px;
        }
        .petalo span {
            font-size: 24px;
        }
        .petalo:hover {
            transform: scale(1.1) rotate(var(--rotacion));
            background: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        /* Posicionamiento de los 7 pétalos en círculo */
        .p1 { transform: rotate(0deg) translateY(-110px); --rotacion: 0deg; }
        .p2 { transform: rotate(51.4deg) translateY(-110px); --rotacion: 51.4deg; }
        .p3 { transform: rotate(102.8deg) translateY(-110px); --rotacion: 102.8deg; }
        .p4 { transform: rotate(154.2deg) translateY(-110px); --rotacion: 154.2deg; }
        .p5 { transform: rotate(205.6deg) translateY(-110px); --rotacion: 205.6deg; }
        .p6 { transform: rotate(257.0deg) translateY(-110px); --rotacion: 257.0deg; }
        .p7 { transform: rotate(308.4deg) translateY(-110px); --rotacion: 308.4deg; }

        /* Tarjeta de mensaje emergente */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: aparecer 0.3s ease;
            position: relative;
        }
        .modal-content h3 {
            color: #ff4b6e;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        .modal-content p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .cerrar-btn {
            background: #ff4b6e;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .cerrar-btn:hover {
            background: #e03e5c;
        }

        @keyframes aparecer {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Botón de música discreto */
        .music-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <h1>Tocá cada pétalo ❤️</h1>

    <div class="container">
        <!-- Pétalos -->
        <div class="petalo p1" onclick="mostrarMensaje('Pétalo 1', '¿Sabés qué recuerdo me encanta? Esas noches en las que me quedaba en tu casa viendo películas juntos. Capaz para cualquiera era simplemente ver una película, pero para mí eran momentos simples que se volvían especiales solamente porque estaba con vos. ❤️')"><span>🌸</span></div>
        <div class="petalo p2" onclick="mostrarMensaje('Pétalo 2', 'Hay algo de vos que me encanta muchísimo: la forma en la que me hacés sentir amado. Me encanta cuando te agarra esa locura de amor y empezás a abrazarme, besarme y decirme cuánto me amás. Me encanta verte así y sentir todo ese amor que tenés por mí. 🥰❤️')"><span>🌸</span></div>
        <div class="petalo p3" onclick="mostrarMensaje('Pétalo 3', 'Gracias por cada sonrisa, por cada abrazo y por estar siempre a mi lado en cada momento. ✨')"><span>🌸</span></div>
        <div class="petalo p4" onclick="mostrarMensaje('Pétalo 4', 'Me fascina tu risa y la forma en que iluminás mis días con solo un mensaje o una mirada. 💫')"><span>🌸</span></div>
        <div class="petalo p5" onclick="mostrarMensaje('Pétalo 5', 'Cada instante a tu lado se convierte en un recuerdo inolvidable que guardo siempre en el corazón. 💖')"><span>🌸</span></div>
        <div class="petalo p6" onclick="mostrarMensaje('Pétalo 6', 'Quiero que siempre estemos juntos y que nos amemos tanto o más que ahora. Quiero seguir compartiendo momentos con vos, seguir riéndonos, seguir haciendo recuerdos y seguir viviendo muchas cosas juntos. ❤️')"><span>🌸</span></div>
        <div class="petalo p7" onclick="mostrarMensaje('Pétalo 7', 'Eres lo más hermoso e importante que me pasó. Sos todo lo que está bien. Cuando todo se me cae y las cosas están mal, estás vos para hacerme levantar. Te amo demasiado. ❤️')"><span>🌸</span></div>

        <!-- Centro -->
        <div class="centro" onclick="mostrarMensaje('Nuestra foto', 'Sos mi persona favorita en el mundo entero. Te amo hoy y siempre. ❤️')">
            <img src="nuestra-foto.jpg" alt="Nuestra foto">
        </div>
    </div>

    <button class="music-btn" onclick="toggleMusica()">🎵 Reproducir / Pausar Música</button>

    <!-- Modal -->
    <div class="modal" id="modalMensaje">
        <div class="modal-content">
            <h3 id="modalTitulo">Título</h3>
            <p id="modalTexto">Texto</p>
            <button class="cerrar-btn" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <!-- Audio (sin reproducción automática forzada para evitar que suene solo de golpe) -->
    <audio id="musicaFondo" loop>
        <source src="cancion.mp3" type="audio/mp3">
        Tu navegador no soporta audio.
    </audio>

    <script>
        const audio = document.getElementById('musicaFondo');
        const modal = document.getElementById('modalMensaje');
        const modalTitulo = document.getElementById('modalTitulo');
        const modalTexto = document.getElementById('modalTexto');

        function mostrarMensaje(titulo, texto) {
            modalTitulo.innerText = titulo;
            modalTexto.innerText = texto;
            modal.style.display = 'flex';
        }

        function cerrarModal() {
            modal.style.display = 'none';
        }

        function toggleMusica() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
    </script>
</body>
</html>
